<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Particle Bridge</title>
<style>
  :root { --bg:#f6f8f7; --fg:#12201b; --accent:#1f9d74; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1310; --fg:#eef6f2; --accent:#2eb78c; } }
  :root[data-theme="dark"] { --bg:#0b1310; --fg:#eef6f2; --accent:#2eb78c; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; overflow:hidden; }
  .hero { position:relative; height:100%; min-height:520px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .copy { position:absolute; left:50%; top:calc(6% + env(safe-area-inset-top,0px)); transform:translateX(-50%); width:min(92%,900px); text-align:center; pointer-events:none; }
  h1 { margin:0; font-size:clamp(1.8rem,4.6vw,3.6rem); line-height:1.12; font-weight:700; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .sub { margin:clamp(12px,2vw,20px) auto 0; max-width:720px; font-size:clamp(.95rem,1.7vw,1.2rem); line-height:1.55; opacity:.78; }
</style>
</head>
<body>
<section class="hero">
  <canvas id="c"></canvas>
  <div class="copy">
    <h1>We exist to unlock <span>pathways</span> for investable businesses</h1>
    <p class="sub">NYEIB connect growth-oriented businesses with the capital, strategic partnerships and practical support they need to become more credible, resilient and investment-ready.</p>
  </div>
</section>
<script>
const COLOR = "#2eb78c", LIGHT = "#b8f5df";
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
let W, H, dpr, gap, deckY, parts = [], travelers = [];
const mouse = { x: -9999, y: -9999, down: false };

function build() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  gap = Math.max(4, Math.min(7, W / 170));

  const pts = [];
  const add = (x, y, a = 1, wave = 0) => pts.push({ x, y, a, wave });
  const trace = (fn, a = 1) => {           // place dots evenly along any curve
    let last = fn(0), acc = 0; add(last[0], last[1], a);
    for (let i = 1; i <= 400; i++) {
      const p = fn(i / 400); acc += Math.hypot(p[0] - last[0], p[1] - last[1]); last = p;
      if (acc >= gap) { add(p[0], p[1], a); acc = 0; }
    }
  };
  const line = (x1, y1, x2, y2, a) => trace(t => [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t], a);

  const bx0 = W * 0.04, bx1 = W * 0.96, span = bx1 - bx0;
  deckY = H * 0.86;
  const topY = H * 0.6, sag = H * 0.8;
  const t1 = bx0 + span * 0.3, t2 = bx0 + span * 0.7, tw = Math.max(gap * 1.6, W * 0.008);
  const waterY = deckY + H * 0.05;

  // Deck (two rows)
  line(bx0, deckY, bx1, deckY); line(bx0, deckY + gap * 1.4, bx1, deckY + gap * 1.4, 0.8);

  // Towers: two legs, cross beams, pillars into the water
  for (const tx of [t1, t2]) {
    line(tx - tw, waterY, tx - tw, topY); line(tx + tw, waterY, tx + tw, topY);
    line(tx - tw, topY, tx + tw, topY);
    line(tx - tw, (topY + deckY) / 2, tx + tw, (topY + deckY) / 2, 0.8);
  }

  // Cables
  const mainY = t => topY + (sag - topY) * 4 * t * (1 - t);
  const mainFn = t => [t1 + (t2 - t1) * t, mainY(t)];
  const sideL = t => [bx0 + (t1 - bx0) * t, deckY - (deckY - topY) * Math.pow(t, 1.7)];
  const sideR = t => [bx1 - (bx1 - t2) * t, deckY - (deckY - topY) * Math.pow(t, 1.7)];
  trace(mainFn); trace(sideL); trace(sideR);

  // Hangers (the vertical lines from cable to deck)
  const step = gap * 3.6;
  for (let x = t1 + step; x < t2 - step / 2; x += step) {
    const t = (x - t1) / (t2 - t1); line(x, mainY(t), x, deckY, 0.55);
  }
  for (let x = bx0 + step; x < t1 - step / 2; x += step) {
    const t = (x - bx0) / (t1 - bx0); line(x, deckY - (deckY - topY) * Math.pow(t, 1.7), x, deckY, 0.55);
  }
  for (let x = t2 + step; x < bx1 - step / 2; x += step) {
    const t = (bx1 - x) / (bx1 - t2); line(x, deckY - (deckY - topY) * Math.pow(t, 1.7), x, deckY, 0.55);
  }

  // Water lines that gently shimmer
  for (let k = 0; k < 4; k++) {
    const y = waterY + k * gap * 2.4;
    for (let x = bx0; x < bx1; x += gap * 1.6) add(x, y, 0.2 - k * 0.03, 1);
  }

  parts = pts.map((t, i) => {
    const p = parts[i] || { x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0 };
    p.tx = t.x; p.ty = t.y; p.a = t.a; p.wave = t.wave; p.r = gap * 0.36;
    return p;
  });

  // Travelers: small bright dots crossing the bridge (the "pathway")
  travelers = Array.from({ length: 10 }, (_, i) => ({ x: bx0 + (span / 10) * i, v: 0.8 + Math.random() * 0.9, x0: bx0, x1: bx1 }));
}

function frame(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = COLOR;
  const R = Math.max(70, Math.min(W, H) * 0.13);
  for (const p of parts) {
    const ty = p.ty + (p.wave ? Math.sin(time * 0.002 + p.tx * 0.02) * 3 : 0);
    p.vx += (p.tx - p.x) * 0.055; p.vy += (ty - p.y) * 0.055;
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
    if (d2 < R * R) { const d = Math.sqrt(d2) || 1, f = (1 - d / R) * (mouse.down ? 10 : 4); p.vx += dx / d * f; p.vy += dy / d * f; }
    p.vx *= 0.82; p.vy *= 0.82; p.x += p.vx; p.y += p.vy;
    ctx.globalAlpha = p.a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  // Travelers
  ctx.fillStyle = LIGHT; ctx.globalAlpha = 1;
  for (const t of travelers) {
    t.x += t.v; if (t.x > t.x1) t.x = t.x0;
    let y = deckY - gap * 1.3;
    const dx = t.x - mouse.x, dy = y - mouse.y;
    if (dx * dx + dy * dy < R * R) y -= (1 - Math.hypot(dx, dy) / R) * 30;
    ctx.beginPath(); ctx.arc(t.x, y, gap * 0.5, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

function pos(e) { const t = e.touches ? e.touches[0] : e, r = canvas.getBoundingClientRect(); mouse.x = t.clientX - r.left; mouse.y = t.clientY - r.top; }
addEventListener("mousemove", pos);
addEventListener("touchmove", pos, { passive: true });
addEventListener("touchstart", e => { pos(e); mouse.down = true; }, { passive: true });
addEventListener("mousedown", () => mouse.down = true);
addEventListener("mouseup", () => mouse.down = false);
addEventListener("touchend", () => { mouse.down = false; mouse.x = mouse.y = -9999; });
addEventListener("resize", build);
build(); requestAnimationFrame(frame);
</script>
</body>
</html>
